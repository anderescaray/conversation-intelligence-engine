name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Runners have no GPU: never install the multi-GB 'ml' group (torch). See ADR-0005.
      - name: Install dependencies
        run: uv sync --locked --no-group ml

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # Integration and gpu markers are excluded by addopts in pyproject.toml.
      - name: Unit tests
        run: uv run pytest -q
