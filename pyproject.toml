[project]
name = "convintel"
version = "0.1.0"
description = "Conversation Intelligence Engine: transcribe, redact and analyze voice and chat conversations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=15.1,<17",
    "fastapi>=0.142,<1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "numpy>=2.3,<3",
    "openinference-instrumentation-langchain>=0.1.78",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "prometheus-client>=0.26.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "twilio>=9.8,<10",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "hypothesis>=6.168.3",
    "pre-commit>=4.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]
# Local model work only (torch, spaCy NER model); never installed by default or in CI.
# See docs/adr/0005.
ml = [
    "datasets>=4",
    "en-core-web-lg",
    "faster-whisper>=1.2.1,<2",
    "huggingface-hub>=1.0",
    "matplotlib>=3.9",
    "mlflow>=3.16,<4",
    "torch>=2.7",
    "transformers>=5.18.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# macOS has no CUDA wheels and falls back to PyPI, which keeps `uv lock` universal.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# spaCy model for PII NER; must match the installed spaCy minor version (3.8.x).
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests", "scripts", "training"]
strict = ["src/convintel/contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not gpu'"
markers = [
    "integration: needs docker compose services or network access",
    "gpu: needs a CUDA GPU and the 'ml' dependency group",
]
