[project]
name = "convintel"
version = "0.1.0"
description = "Conversation Intelligence Engine: transcribe, redact and analyze voice and chat conversations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "opentelemetry-api>=1.45.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]
# Local GPU work only; never installed by default or in CI. See docs/adr/0005.
ml = [
    "torch>=2.7",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# macOS has no CUDA wheels and falls back to PyPI, which keeps `uv lock` universal.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests", "scripts"]
strict = ["src/convintel/contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not gpu'"
markers = [
    "integration: needs docker compose services or network access",
    "gpu: needs a CUDA GPU and the 'ml' dependency group",
]
