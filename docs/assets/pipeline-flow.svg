<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="1000" height="664" role="img" aria-label="Flow: a signed Twilio webhook, speech to text for voice, personal data redaction, then sentiment, summary and intent in parallel. Intent keeps the classifier answer above the confidence threshold and otherwise goes to an LLM verifier, still in progress. Everything ends in one structured result with latency and cost per step."><title>How a conversation moves through the system</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style><defs><marker id="a" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l5.5 3-5.5 3" fill="none" stroke="#AEAEB2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1000" height="664" rx="26" fill="#F2F2F7"/><text x="30" y="42" font-size="24" font-weight="600" fill="#1D1D1F" text-anchor="start">How a conversation moves through the system</text><rect x="24" y="96" width="276" height="94" rx="18" fill="#FFFFFF"/><text x="42" y="125" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Twilio webhook</text><text x="42" y="146" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">A voice call, SMS or chat arrives</text><path d="M45.5 164v-2.8a3.4 3.4 0 0 1 6.8 0v2.8" fill="none" stroke="#248A3D" stroke-width="1.5"/><rect x="43.4" y="164" width="11" height="8.6" rx="2" fill="#248A3D"/><text x="61" y="172.5" font-size="13" font-weight="600" fill="#248A3D" text-anchor="start">Cryptographic signature checked first</text><rect x="352" y="96" width="200" height="94" rx="18" fill="#FFFFFF"/><text x="370" y="125" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Speech to text</text><text x="370" y="146" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">faster-whisper, one channel</text><text x="370" y="164" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">per speaker</text><rect x="604" y="96" width="372" height="94" rx="18" fill="#FFFFFF"/><text x="622" y="125" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="start">Redact personal data</text><text x="622" y="146" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">Presidio and spaCy, before any model reads the text</text><rect x="790" y="111" width="62" height="19" rx="9.5" fill="#FF9500"/><text x="821" y="124.5" font-size="9.2" font-weight="700" fill="#1D1D1F" text-anchor="middle">PERSON</text><rect x="858" y="111" width="104" height="19" rx="9.5" fill="#FF9500"/><text x="910" y="124.5" font-size="9.2" font-weight="700" fill="#1D1D1F" text-anchor="middle">EMAIL_ADDRESS</text><text x="622" y="171" font-size="13" font-weight="600" fill="#D70015" text-anchor="start">If this step fails, the request stops</text><path d="M300 143H346" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="323" y="134" font-size="12.5" font-weight="500" fill="#6E6E73" text-anchor="middle">Voice</text><path d="M552 143H598" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M160 95V82Q160 76 166 76H712Q718 76 718 82V91" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="388" y="66" width="148" height="20" fill="#F2F2F7"/><text x="462" y="80" font-size="12.5" font-weight="500" fill="#6E6E73" text-anchor="middle">Chat and SMS skip this</text><path d="M790 191V206Q790 212 784 212H46Q40 212 40 218V250" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="240" width="716" height="322" rx="20" fill="#FFFFFF"/><text x="62" y="270" font-size="15.5" font-weight="600" fill="#1D1D1F" text-anchor="start">Analysed in parallel, on the redacted text only</text><rect x="62" y="290" width="214" height="56" rx="12" fill="#F2F2F7"/><text x="76" y="314" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Sentiment</text><text x="76" y="333" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">RoBERTa, runs locally</text><rect x="62" y="358" width="214" height="56" rx="12" fill="#F2F2F7"/><text x="76" y="382" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Summary</text><text x="76" y="401" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Claude Haiku 4.5, via API</text><rect x="62" y="426" width="214" height="56" rx="12" fill="#F2F2F7"/><text x="76" y="450" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Intent</text><text x="76" y="469" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Fine-tuned DistilBERT, locally</text><path d="M40 250V448" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 312Q40 318 46 318H56" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M40 380Q40 386 46 386H56" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M40 448Q40 454 46 454H56" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M276 318H740" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M276 386H740" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M276 454H312" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="318" y="430" width="132" height="48" rx="24" fill="#E7F1FF"/><text x="384" y="451" font-size="13.5" font-weight="700" fill="#0A7AFF" text-anchor="middle">Confidence ≥ τ ?</text><text x="384" y="468" font-size="12.5" font-weight="500" fill="#0A7AFF" text-anchor="middle">τ = 0.861</text><path d="M450 454H486" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="471" y="447" font-size="12.5" font-weight="600" fill="#248A3D" text-anchor="middle">Yes</text><rect x="492" y="426" width="226" height="56" rx="12" fill="#F2F2F7"/><text x="506" y="450" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Keep the classifier's answer</text><text x="506" y="468" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">87.5% of test cases, no API cost</text><path d="M718 454H740" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M384.0 479V518Q384.0 524 390.0 524H486" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="1 5"/><text x="396" y="496" font-size="12.5" font-weight="600" fill="#D70015" text-anchor="start">No</text><rect x="492" y="496" width="226" height="56" rx="12" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1.4" stroke-dasharray="5 4"/><text x="506" y="520" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">LLM verifier picks from top 5</text><text x="506" y="539" font-size="12.5" font-weight="600" fill="#B25000" text-anchor="start">In progress: not switched on yet</text><path d="M718 524H726Q732 524 732 518V460" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 5"/><path d="M740 318H764" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M740 386H764" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M740 454H764" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="770" y="240" width="206" height="322" rx="20" fill="#FFFFFF"/><text x="788" y="270" font-size="15.5" font-weight="600" fill="#1D1D1F" text-anchor="start">One structured result</text><text x="788" y="300" font-size="13.5" font-weight="400" fill="#1D1D1F" text-anchor="start">Why they contacted us</text><text x="788" y="324" font-size="13.5" font-weight="400" fill="#1D1D1F" text-anchor="start">Customer mood over time</text><text x="788" y="348" font-size="13.5" font-weight="400" fill="#1D1D1F" text-anchor="start">Summary and next steps</text><text x="788" y="372" font-size="13.5" font-weight="400" fill="#1D1D1F" text-anchor="start">Resolved or not</text><path d="M788 388H958" stroke="#E5E5EA"/><text x="788" y="410" font-size="13.5" font-weight="600" fill="#0A7AFF" text-anchor="start">Latency per step</text><text x="788" y="434" font-size="13.5" font-weight="600" fill="#0A7AFF" text-anchor="start">Tokens and cost per step</text><path d="M788 450H958" stroke="#E5E5EA"/><text x="788" y="472" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">A failed step leaves a gap</text><text x="788" y="490" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">and a named error, not a crash</text><rect x="24" y="576" width="952" height="64" rx="18" fill="#FFFFFF"/><text x="42" y="603" font-size="15" font-weight="600" fill="#1D1D1F" text-anchor="start">Every step is measured</text><text x="42" y="623" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Personal data never appears in any of these</text><path d="M322 590v36" stroke="#E5E5EA"/><text x="340" y="603" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Phoenix</text><text x="340" y="623" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Trace of each conversation</text><path d="M540 590v36" stroke="#E5E5EA"/><text x="558" y="603" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">Prometheus and Grafana</text><text x="558" y="623" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Latency, errors, tokens and spend</text><path d="M782 590v36" stroke="#E5E5EA"/><text x="800" y="603" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">MLflow</text><text x="800" y="623" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">Model versions</text></svg>
