global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI service (T12) runs on the host: `uv run uvicorn convintel.api.main:app`.
  - job_name: convintel-api
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # `uv run python -m convintel.telemetry.demo` exposes metrics on :9100.
  - job_name: convintel-demo
    static_configs:
      - targets: ["host.docker.internal:9100"]
